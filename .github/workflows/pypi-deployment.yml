name: Publish Python 🐍 distribution 📦 to PyPI (DISABLED)

# NEUTRALIZED for the internal msr-central fork: this repository must never
# publish to public PyPI. Automatic push/tag triggers are removed and every
# job is guarded with `if: false`. Internal releases are published to the
# Azure DevOps Artifacts feed by a separate workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦
    if: false  # neutralized: never run on the internal fork
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Install package and doc dependencies for skill build
      run: pip install -e .[dev]
    - name: Build Copilot skill data
      run: python scripts/build_skill.py
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: false  # neutralized: never publish to public PyPI from the internal fork
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai4s-jobq
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
      attestations: write  # Required for artifact attestation

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: python-package-distributions
        path: dist/
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: 'dist/*'
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
