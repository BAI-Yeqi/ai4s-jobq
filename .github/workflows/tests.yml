name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --require-hashes --no-deps -r requirements-ci.lock
        python -m pip install --no-deps -e .
    - name: Verify requirements-ci.lock is up-to-date
      run: |
        python -m pip install pip-tools
        pip-compile --extra=dev --generate-hashes --output-file=requirements-ci.lock --strip-extras pyproject.toml
        git diff --exit-code requirements-ci.lock || {
          echo "::error::requirements-ci.lock is out of date. Run: pip-compile --extra=dev --generate-hashes --output-file=requirements-ci.lock --strip-extras pyproject.toml"
          exit 1
        }
    - name: Ruff lint
      run: ruff check --output-format=github .
    - name: Ruff format check
      run: ruff format --check .
    - name: Mypy
      run: mypy ai4s/ --no-namespace-packages

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: Set up Node.js
      uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
      with:
        node-version: '20'
    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        python -m pip install doc8 vale
        npm install -g markdownlint-cli
    - name: Download Vale styles
      run: vale sync
    - name: doc8 (RST)
      run: doc8
    - name: markdownlint (Markdown)
      run: markdownlint '**/*.md' --ignore node_modules --ignore vale-styles
    - name: Vale (prose style)
      run: vale --minAlertLevel error docs/ README.md CONTRIBUTING.md SUPPORT.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        include:
          - python-version: '3.10'
            toxenv: py310
          - python-version: '3.11'
            toxenv: py311
          - python-version: '3.12'
            toxenv: py312

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        npm install azurite
        ./node_modules/.bin/azurite-blob --skipApiVersionCheck --inMemoryPersistence --blobPort 10000 &
        ./node_modules/.bin/azurite-queue --skipApiVersionCheck --inMemoryPersistence --queuePort 10001 &
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Test with tox
      run: |
        tox -e ${{ matrix.toxenv }}

  docs:
    name: Docs Accessibility
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Test Docs Accessibility
      run: |
        tox -e accessibility
